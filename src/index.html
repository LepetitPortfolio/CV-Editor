<!doctype html>
<html lang="fr">
<head>
<!-- Les scripts defer s'exécutent dans l'ORDRE : de la fondation (données)
     vers le câblage (événements) puis l'init (main). -->
<script src="cv-model.js" defer></script>
<script src="cv-utils.js" defer></script>
<script src="cv-keywords.js" defer></script>
<script src="cv-analyse.js" defer></script>
<script src="cv-preview.js" defer></script>
<script src="cv-panel.js" defer></script>
<script src="cv-actions.js" defer></script>
<script src="cv-events.js" defer></script>
<script src="cv-theme.js" defer></script>
<script src="main.js" defer></script>
<link rel="stylesheet" href="cv-editor.css">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Éditeur de CV — local & ATS-friendly</title>
</head>

<body>

<header class="topbar">
  <div class="brand"><span class="logo">CV</span> Éditeur de CV <span class="tag">standalone · 100 % local</span></div>
  <div class="actions">
    <input type="color" id="editor-accent-input" value="#000000" title="Couleur de l’éditeur (double-clic pour réinitialiser)" />
    <button class="btn primary" id="btn-dark" title="Basculer clair / sombre">🌙</button>
    <button class="btn primary" id="btn-export-json">⬇ Export JSON</button>
    <button class="btn primary" id="btn-import-json">⬆ Import JSON</button>
    <input type="file" id="file-input" accept=".json" hidden />
    <button class="btn primary" id="btn-print">🖨 Exporter PDF (ATS)</button>
    <button class="btn reset" id="btn-reset">🗑 Recommencer de zéro</button>
  </div>
</header>

<div class="layout">

  <!-- ======== Colonne édition ======== -->
  <div class="editor">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="profil">Profil</button>
      <button class="tab" data-tab="experiences">Expériences</button>
      <button class="tab" data-tab="competences">Compétences</button>
      <button class="tab" data-tab="SoftSkill">Soft-Skill</button>
      <button class="tab" data-tab="autresinformations">Autres Informations</button>
      <button class="tab" data-tab="Customisation">Personnalisation</button>
      <button class="tab" data-tab="analyse">Analyse d'offre</button>
    </nav>

    <div class="panel" id="panel-container"></div>
  </div>

  <!-- ======== Colonne aperçu ======== -->
  <div class="preview-wrap">
    <div class="preview-meta">
      <span>Aperçu live — template ATS</span>
      <span>📄 A4 · texte sélectionnable</span>
    </div>
    <div class="preview-frame">
      <div class="preview-scroll">
        <div class="cv-page" id="cv-preview"></div>
      </div>
    </div>
  </div>
</div>

  <script>
    document.addEventListener("DOMContentLoaded", () => renderAll());
  </script>

  <footer class="site-footer" id="site-footer">
  CV-Editor — standalone · 100 % local ·
  <a href="https://github.com/LepetitPortfolio/CV-Editor" target="_blank" rel="noopener">Code source</a> ·
  <a href="https://github.com/LepetitPortfolio" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://www.lepetitportfolio.fr" target="_blank" rel="noopener">Portfolio</a>
</footer>
</body>

</html>
